<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global News Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .news-card { transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease; }
    .news-card:hover { transform: translateY(-2px); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.9s linear infinite; display: inline-block; }
    @keyframes urgentPulse { 0%,100%{opacity:1} 50%{opacity:.6} }
    .urgent-pulse { animation: urgentPulse 1.8s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-xl">

    <!-- Row 1: Brand + meta + refresh -->
    <div class="max-w-screen-2xl mx-auto px-4 pt-3 pb-2 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2 mr-auto">
        <svg class="w-5 h-5 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064"/>
        </svg>
        <h1 class="text-base font-bold tracking-tight text-white">Global News Monitor</h1>
      </div>
      <span id="last-updated" class="text-xs text-gray-500 hidden sm:block"></span>
      <span id="article-count" class="text-xs text-gray-600 font-mono"></span>
      <button id="refresh-btn" onclick="loadNews()"
              class="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-500
                     text-white text-xs font-semibold rounded-lg transition-colors">
        <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Aktualisieren
      </button>
    </div>

    <!-- Row 2: View mode tabs + filters in one row -->
    <div class="max-w-screen-2xl mx-auto px-4 pb-2 flex flex-wrap items-center gap-2">

      <!-- View tabs -->
      <div class="flex gap-1.5 mr-3">
        <button data-view="regions"  onclick="setView('regions')"
                class="view-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
          🌍 Regionen
        </button>
        <button data-view="trending" onclick="setView('trending')"
                class="view-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
          🔥 Trending
        </button>
        <button data-view="breaking" onclick="setView('breaking')"
                class="view-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
          ⚡ Breaking
        </button>
        <button data-view="mostread" onclick="setView('mostread')"
                class="view-tab px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
          👁 Meist gelesen
        </button>
      </div>

      <!-- Divider -->
      <div class="w-px h-5 bg-gray-600 hidden sm:block"></div>

      <!-- Type filter -->
      <div class="flex gap-1">
        <button onclick="setTypeFilter('all')" data-type="all"
                class="type-tab px-2.5 py-1 rounded-full text-xs font-medium transition-colors bg-gray-700 text-gray-300">
          Alle
        </button>
        <button onclick="setTypeFilter('Mainstream')" data-type="Mainstream"
                class="type-tab px-2.5 py-1 rounded-full text-xs font-medium transition-colors bg-gray-700 text-gray-300">
          <span class="inline-block w-2 h-2 rounded-full bg-orange-500 mr-1"></span>Mainstream
        </button>
        <button onclick="setTypeFilter('Alternative')" data-type="Alternative"
                class="type-tab px-2.5 py-1 rounded-full text-xs font-medium transition-colors bg-gray-700 text-gray-300">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1"></span>Alternativ
        </button>
      </div>

      <!-- Time filter -->
      <select id="time-filter" onchange="setTimeFilter(this.value)"
              class="bg-gray-700 text-gray-300 text-xs rounded-lg px-2.5 py-1.5 border border-gray-600
                     focus:outline-none focus:border-blue-500 cursor-pointer">
        <option value="48">Letzte 48 Std.</option>
        <option value="24">Letzte 24 Std.</option>
        <option value="12">Letzte 12 Std.</option>
        <option value="6">Letzte 6 Std.</option>
      </select>

      <!-- Search -->
      <div class="relative ml-auto">
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500 pointer-events-none"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
        </svg>
        <input id="search-input" type="text" placeholder="Stichwort suchen…"
               oninput="setSearch(this.value)"
               class="bg-gray-700 text-gray-200 text-xs rounded-lg pl-8 pr-3 py-1.5
                      border border-gray-600 focus:outline-none focus:border-blue-500 w-44 sm:w-56" />
      </div>
    </div>

    <!-- Row 3: Legend -->
    <div class="max-w-screen-2xl mx-auto px-4 pb-2 flex flex-wrap gap-5 text-xs text-gray-500">
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-orange-500 shrink-0"></span>Staatlich / Mainstream
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>Alternativ / Unabhängig
      </span>
      <span class="flex items-center gap-1.5">
        <span class="text-red-400 urgent-pulse">⚡</span>Breaking
      </span>
      <span class="flex items-center gap-1.5">
        <span class="text-yellow-400">🔥</span>Trending (≥3 Quellen)
      </span>
    </div>
  </header>

  <!-- ── States ───────────────────────────────────────────────────────────── -->
  <div id="loading" class="flex-1 flex flex-col items-center justify-center py-24 hidden">
    <div class="spinner text-blue-500 mb-4">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </div>
    <p class="text-gray-400 text-sm">Nachrichten werden geladen …</p>
  </div>
  <div id="error-box" class="hidden max-w-md mx-auto mt-16 p-5 bg-red-900/30 border border-red-700
       rounded-xl text-red-300 text-sm text-center"></div>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <main id="news-grid" class="max-w-screen-2xl mx-auto w-full px-4 py-6 flex-1"></main>

  <footer class="text-center text-gray-700 text-xs py-5 border-t border-gray-800">
    Global News Monitor · RSS-Quellen · Aktualisierung alle 30 Minuten
  </footer>

  <script src="app.js"></script>
</body>
</html>
